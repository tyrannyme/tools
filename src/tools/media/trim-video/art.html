<div class="scene" data-glow="0.5 0.42">
  <div class="piece left"><div class="strip" data-frames="0 1"></div></div>
  <div class="piece right"><div class="strip" data-frames="5 6"></div></div>
  <div class="piece kept">
    <div class="strip" data-frames="2 3 4"></div>
    <div class="cut a"></div>
    <div class="cut b"></div>
  </div>
</div>
<style>
  .scene {
    position: relative;
    width: 1280px;
    height: 800px;
  }
  .piece {
    position: absolute;
    top: 50%;
    height: 300px;
    margin-top: -150px;
  }
  .strip {
    position: relative;
    height: 100%;
    display: flex;
    gap: 14px;
    padding: 54px 14px;
    overflow: hidden;
    background: #0f0c1d;
    box-shadow:
      inset 0 3px 0 var(--gold),
      inset 0 -3px 0 var(--gold),
      inset 0 9px 0 #0f0c1d,
      inset 0 11px 0 rgb(230 192 114 / 0.55),
      inset 0 -9px 0 #0f0c1d,
      inset 0 -11px 0 rgb(230 192 114 / 0.55);
  }
  .holes {
    position: absolute;
    left: 0;
    right: 0;
    height: 22px;
    display: flex;
    gap: 18px;
    padding-left: 12px;
  }
  .holes span {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: rgb(23 19 42 / 0.25);
    box-shadow:
      inset 0 0 0 2px rgb(230 192 114 / 0.75),
      0 0 6px rgb(230 192 114 / 0.25);
  }
  .kept .holes {
    padding-left: 6px;
  }
  .holes.top {
    top: 19px;
  }
  .holes.bottom {
    bottom: 19px;
  }
  .frame {
    flex: none;
    width: 260px;
    height: 192px;
    border-radius: 6px;
    background: url("asset:samples/doorway.webp") no-repeat;
    box-shadow: inset 0 0 0 2px rgb(230 192 114 / 0.6);
  }

  .left {
    right: calc(50% + 456px);
    transform-origin: 100% 50%;
    transform: translateY(40px) rotate(-7deg);
  }
  .right {
    left: calc(50% + 456px);
    transform-origin: 0 50%;
    transform: translateY(40px) rotate(7deg);
  }
  .left .strip,
  .right .strip {
    filter: brightness(0.5) saturate(0.6);
  }
  .left .strip {
    padding-right: 0;
  }
  .right .strip {
    padding-left: 0;
  }

  .kept {
    left: 50%;
    width: 834px;
    margin-left: -417px;
    transform: translateY(-34px);
    filter: drop-shadow(0 40px 50px rgb(10 6 24 / 0.65));
  }
  .kept .strip {
    padding-left: 13px;
    padding-right: 13px;
    box-shadow:
      inset 0 3px 0 var(--gold),
      inset 0 -3px 0 var(--gold),
      inset 0 9px 0 #0f0c1d,
      inset 0 11px 0 rgb(230 192 114 / 0.55),
      inset 0 -9px 0 #0f0c1d,
      inset 0 -11px 0 rgb(230 192 114 / 0.55),
      0 0 70px 8px rgb(230 192 114 / 0.28);
  }
  .cut {
    position: absolute;
    top: -34px;
    bottom: -34px;
    width: 4px;
    margin-left: -2px;
    background: var(--gold-light);
    box-shadow: 0 0 22px 5px rgb(230 192 114 / 0.8);
    border-radius: 2px;
  }
  .cut.a {
    left: 0;
  }
  .cut.b {
    left: 100%;
  }
  .cut::before,
  .cut::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 22px;
    height: 22px;
    margin-left: -11px;
    background: var(--gold-light);
    transform: rotate(45deg);
    box-shadow: 0 0 18px 4px rgb(230 192 114 / 0.7);
  }
  .cut::before {
    top: -11px;
  }
  .cut::after {
    bottom: -11px;
  }
</style>
<script type="module">
  // A slow push in on the painting, one step per frame, as if it were a shot.
  const shots = [
    [100, 50, 18],
    [108, 50, 24],
    [118, 50, 30],
    [130, 50, 34],
    [144, 50, 38],
    [160, 50, 41],
    [178, 50, 44],
  ];
  for (const strip of document.querySelectorAll(".strip")) {
    for (const where of ["top", "bottom"]) {
      const row = document.createElement("div");
      row.className = `holes ${where}`;
      row.innerHTML = "<span></span>".repeat(strip.closest(".kept") ? 21 : 30);
      strip.append(row);
    }
    for (const index of strip.dataset.frames.split(" ").map(Number)) {
      const [size, x, y] = shots[index];
      const frame = document.createElement("div");
      frame.className = "frame";
      frame.style.backgroundSize = `${size}% auto`;
      frame.style.backgroundPosition = `${x}% ${y}%`;
      strip.append(frame);
    }
  }
</script>
