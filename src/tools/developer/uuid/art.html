<div class="stage" data-glow="0.5 0.42">
  <div class="frame">
    <canvas class="print" width="520" height="600"></canvas>
  </div>
</div>
<style>
  .stage {
    position: relative;
    filter: drop-shadow(0 40px 60px rgb(10 6 24 / 0.6));
  }
  .frame {
    position: relative;
    width: 500px;
    height: 600px;
    border-radius: 250px 250px 26px 26px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 44%, rgb(230 192 114 / 0.22), transparent 62%),
      linear-gradient(170deg, #2a2148, #120e22);
    outline: 4px solid var(--gold);
    outline-offset: 12px;
    box-shadow:
      0 0 0 4px var(--gold),
      0 0 0 12px rgb(23 19 42 / 0.6),
      0 0 60px 10px rgb(230 192 114 / 0.35),
      inset 0 0 80px rgb(10 6 24 / 0.7);
  }
  .print {
    position: absolute;
    left: -10px;
    top: 0;
    filter: drop-shadow(0 0 10px rgb(230 192 114 / 0.55))
      drop-shadow(0 0 2px rgb(248 230 184 / 0.6));
  }
</style>
<script type="module">
  // A fingerprint of gold ridges: a whorl that loosens into arches toward the crease.
  const canvas = document.querySelector(".print");
  const ctx = canvas.getContext("2d");
  const { width: w, height: h } = canvas;
  const image = ctx.createImageData(w, h);

  // Smooth value noise, seeded, for the organic wobble of the ridges.
  const hash = (x, y) => {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  };
  const smooth = (t) => t * t * (3 - 2 * t);
  const noise = (x, y) => {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const u = smooth(x - xi);
    const v = smooth(y - yi);
    const a = hash(xi, yi);
    const b = hash(xi + 1, yi);
    const c = hash(xi, yi + 1);
    const d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const step = (a, b, x) => smooth(clamp((x - a) / (b - a)));

  const cx = w / 2 + 6;
  const cy = h * 0.45;
  const spacing = 15.5;

  const phase = (x, y) => {
    const dx = x - cx;
    const dy = y - cy;
    // Concentric loops whose centres drift down as they widen, so the outer ridges sweep low.
    const r0 = Math.hypot(dx, dy * 0.9);
    const r = Math.hypot(dx * 1.04, (dy - 0.18 * r0) * 0.86);
    // A spiral twist at the core.
    const twist = (Math.atan2(dy, dx) / (2 * Math.PI)) * spacing;
    return r + twist + (noise(x / 80, y / 80) - 0.5) * 26 + (noise(x / 24 + 9, y / 24) - 0.5) * 5;
  };
  const wrap = (d) => d - spacing * Math.round(d / spacing);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = phase(x, y);
      const gx = wrap(phase(x + 1, y) - p);
      const gy = wrap(phase(x, y + 1) - p);
      const grad = Math.max(0.35, Math.hypot(gx, gy));
      // Distance to the nearest ridge centre in pixels.
      const f = p / spacing;
      const dist = (Math.abs(f - Math.round(f)) * spacing) / grad;
      const ink = 1 - step(2.3, 3.3, dist);

      // Fingertip outline: a tall rounded shape with a soft rim.
      const ex = (x - cx) / 188;
      const ey = (y - (cy + 34)) / (y < cy + 34 ? 236 : 262);
      const edge = Math.hypot(ex, ey) + (noise(x / 50, y / 50) - 0.5) * 0.06;
      const mask = 1 - step(0.92, 1.0, edge);
      // Short breaks in the ridges, like the endings in a real print.
      const gap = 1 - step(0.86, 0.89, noise(x / 10 + 40, y / 10 + 3));
      const a = ink * mask * gap;

      // Gold that catches the light near the top and shimmers along the ridges.
      const light = clamp(1 - y / h + (noise(x / 30 + 7, y / 30) - 0.5) * 0.5);
      const i = (y * w + x) * 4;
      image.data[i] = 200 + 48 * light;
      image.data[i + 1] = 156 + 74 * light;
      image.data[i + 2] = 82 + 102 * light * light;
      image.data[i + 3] = 255 * a;
    }
  }
  ctx.putImageData(image, 0, 0);
</script>
