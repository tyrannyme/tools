<div class="stage" data-glow="0.45 0.45">
  <svg viewBox="0 0 1000 640" width="1000" height="640">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbeec8" />
        <stop offset="0.45" stop-color="#e6c072" />
        <stop offset="1" stop-color="#9a6e2c" />
      </linearGradient>
      <radialGradient id="ink" cx="45%" cy="38%" r="70%">
        <stop offset="0" stop-color="#3a2f63" />
        <stop offset="1" stop-color="#120e22" />

      <radialGradient id="jewel" cx="40%" cy="35%" r="65%">

        <stop offset="0.4" stop-color="#fbeec8" />
        <stop offset="1" stop-color="#e6c072" />

    </defs>

    <!-- The key, laid on a diagonal: bow, shaft, and bit, joined at two jewelled dots. -->
    <g transform="translate(222 452) scale(0.94) rotate(-28)">
      <!-- Bit: the wards that carry the signature. -->
      <path

        d="M640 14 L640 150 L676 150 L676 112 L704 112 L704 150 L740 150 L740 92 L768 92 L768 150 L800 150 L800 14 Z"
      />

      <rect class="metal" x="150" y="-20" width="700" height="40" rx="20" />
      <path class="hair" d="M200 -8 H600 M200 8 H600" />
      <!-- Finial at the tip. -->
      <path class="metal" d="M846 -30 L878 0 L846 30 L834 0 Z" />

      <!-- Bow: a ring of gold around an ink window with a quatrefoil. -->
      <circle cx="0" cy="0" r="168" class="metal" />
      <circle cx="0" cy="0" r="132" fill="url(#ink)" />
      <circle cx="0" cy="0" r="158" class="hair" />
      <circle cx="0" cy="0" r="140" class="hair" />

        <circle cx="0" cy="-54" r="54" />

        <circle cx="-54" cy="0" r="54" />
        <circle cx="54" cy="0" r="54" />
        <circle cx="0" cy="0" r="104" />
      </g>
      <path class="center" d="M0 -34 l24 34 l-24 34 l-24 -34 Z" />

      <!-- The two dots: collars with a jewel each. -->
      <g class="dot">
        <rect class="collar" x="192" y="-50" width="52" height="100" rx="16" />
        <circle cx="218" cy="0" r="21" fill="url(#jewel)" />

      <g class="dot">
        <rect class="collar" x="584" y="-50" width="52" height="100" rx="16" />
        <circle cx="610" cy="0" r="21" fill="url(#jewel)" />
      </g>
    </g>
  </svg>
