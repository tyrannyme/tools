<div class="stage" data-glow="0.5 0.42">
  <canvas id="block"></canvas>
  <div class="seam"></div>
  <svg class="spark glow" viewBox="-40 -40 80 80">
    <path d="M0 -38 C3 -8 8 -3 38 0 C8 3 3 8 0 38 C-3 8 -8 3 -38 0 C-8 -3 -3 -8 0 -38 Z" />
  </svg>
</div>
<style>
  .stage {
    position: relative;
    width: 1000px;
    height: 720px;
    filter: drop-shadow(0 40px 50px rgb(10 6 24 / 0.55));
  }
  .stage canvas {
    position: absolute;
    inset: 0;
  }
  .seam {
    position: absolute;
    left: 498px;
    top: 36px;
    width: 4px;
    height: 620px;
    background: linear-gradient(
      rgb(248 230 184 / 0),
      var(--gold-light) 8%,
      var(--gold-light) 88%,
      rgb(248 230 184 / 0)
    );
  }
  .seam::before {
    content: "";
    position: absolute;
    inset: 0 -8px;
    background: inherit;
    filter: blur(9px);
    opacity: 0.7;
  }
  .spark {
    position: absolute;
    left: 460px;
    top: 0;
    width: 80px;
    height: 80px;
    fill: var(--gold-light);
  }
</style>
<script type="module">
  import { canvas, random } from "asset:art/pixels.js";

  const W = 1000;
  const H = 720;
  const t = 16; // texel size along each block edge
  const c = Math.cos(Math.PI / 6) * t;
  const s = 0.5 * t;
  const top = { x: W / 2, y: 70 };

  // One texture layout, painted twice: the default look, then the new pack's look.
  const rand = random(7);
  const topMap = Array.from({ length: 256 }, () => rand());
  const sideMap = Array.from({ length: 256 }, () => rand());
  const fringe = Array.from({ length: 16 }, () => 3 + Math.floor(rand() * 3));
  const looks = {
    old: {
      grass: ["#4d8a36", "#5b9a40", "#6aa84f", "#7cbf5a"],
      dirt: ["#6a4429", "#7a5134", "#8b5e3c", "#996a45"],
      fleck: "#8f8a84",
      bloom: null,
    },
    new: {
      grass: ["#5f4a9c", "#7560b4", "#8a74c8", "#a48ddf"],
      dirt: ["#3c2541", "#4a2f4f", "#5a3b5f", "#69476e"],
      fleck: "#e6c072",
      bloom: "#f4a8c8",
    },
  };
  const shade = (list, value) => list[Math.min(3, Math.floor(value * 4))];
  function topColor(look, i) {
    const v = topMap[i];
    if (look.bloom && v > 0.95) return look.bloom;
    if (look.bloom && v < 0.03) return look.fleck;
    return shade(look.grass, v);
  }
  function sideColor(look, x, y) {
    const v = sideMap[y * 16 + x];
    if (y < fringe[x]) return shade(look.grass, (v + 0.2) % 1);
    if (v > 0.93) return look.fleck;
    return shade(look.dirt, v);
  }
  // Paints one texel as a parallelogram from origin o along axes a and b.
  function quad(ctx, o, a, b, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(o.x, o.y);
    ctx.lineTo(o.x + a.x, o.y + a.y);
    ctx.lineTo(o.x + a.x + b.x, o.y + a.y + b.y);
    ctx.lineTo(o.x + b.x, o.y + b.y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }
  const ex = { x: c, y: s };
  const ez = { x: -c, y: s };
  const down = { x: 0, y: t };
  const at = (o, u, a, v, b) => ({ x: o.x + u * a.x + v * b.x, y: o.y + u * a.y + v * b.y });
  const left = at(top, 0, ex, 16, ez);
  const front = at(top, 16, ex, 16, ez);

  function block(ctx, look) {
    for (let v = 0; v < 16; v++)
      for (let u = 0; u < 16; u++)
        quad(ctx, at(top, u, ex, v, ez), ex, ez, topColor(look, v * 16 + u));
    // Left face runs from the left corner to the front corner.
    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++)
        quad(ctx, at(left, x, ex, y, down), ex, down, sideColor(look, x, y));
    // Right face runs from the front corner to the right corner.
    const back = { x: -ez.x, y: -ez.y };
    for (let y = 0; y < 16; y++)
      for (let x = 0; x < 16; x++)
        quad(ctx, at(front, x, back, y, down), back, down, sideColor(look, x, y));
    // Light from the upper left.
    ctx.fillStyle = "rgb(16 8 30 / 0.22)";
    face(ctx, left, ex, down);
    ctx.fill();
    ctx.fillStyle = "rgb(16 8 30 / 0.45)";
    face(ctx, front, back, down);
    ctx.fill();
  }
  function face(ctx, o, a, b) {
    ctx.beginPath();
    ctx.moveTo(o.x, o.y);
    ctx.lineTo(o.x + 16 * a.x, o.y + 16 * a.y);
    ctx.lineTo(o.x + 16 * a.x + 16 * b.x, o.y + 16 * a.y + 16 * b.y);
    ctx.lineTo(o.x + 16 * b.x, o.y + 16 * b.y);
    ctx.closePath();
  }
  function rhombus(ctx, cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - ry);
    ctx.lineTo(cx + rx, cy);
    ctx.lineTo(cx, cy + ry);
    ctx.lineTo(cx - rx, cy);
    ctx.closePath();
  }

  function draw() {
    const ctx = canvas(document.getElementById("block"), W, H);
    ctx.clearRect(0, 0, W, H);
    const base = front.y + 16 * t;

    // A gold plinth under the block, in a double hairline.
    const floor = base - 16 * s + 16;
    ctx.shadowColor = "rgb(230 192 114 / 0.8)";
    ctx.shadowBlur = 14;
    ctx.strokeStyle = "#e6c072";
    ctx.lineWidth = 4;
    rhombus(ctx, W / 2, floor, 16 * c + 100, 16 * s + 58);
    ctx.stroke();
    ctx.lineWidth = 2;
    rhombus(ctx, W / 2, floor, 16 * c + 126, 16 * s + 73);
    ctx.stroke();
    ctx.shadowBlur = 0;

    block(ctx, looks.old);
    ctx.save();
    ctx.beginPath();
    ctx.rect(W / 2, 0, W / 2, H);
    ctx.clip();
    block(ctx, looks.new);
    ctx.restore();

    // Gold edges along the silhouette.
    ctx.strokeStyle = "#e6c072";
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(top.x, top.y);
    ctx.lineTo(top.x + 16 * c, top.y + 16 * s);
    ctx.lineTo(top.x + 16 * c, top.y + 16 * s + 16 * t);
    ctx.lineTo(front.x, base);
    ctx.lineTo(left.x, left.y + 16 * t);
    ctx.lineTo(left.x, left.y);
    ctx.closePath();
    ctx.moveTo(left.x, left.y);
    ctx.lineTo(front.x, front.y);
    ctx.lineTo(top.x + 16 * c, top.y + 16 * s);
    ctx.stroke();
  }
  if (window.automedia) window.automedia.registerRenderer(async () => draw());
  else draw();
</script>
