<div class="stage" data-glow="0.56 0.5">
  <div class="sheet">
    <div class="cell"><canvas></canvas></div>
    <div class="cell"><canvas></canvas></div>
    <div class="cell"><canvas></canvas></div>
    <div class="cell empty"></div>
  </div>
  <svg class="cuts line" viewBox="0 0 640 640">
    <path d="M320 4 V636 M4 320 H636" />
    <g class="marks">
      <path
        d="M320 -6 l8 8 -8 8 -8 -8 Z M320 626 l8 8 -8 8 -8 -8 Z M-6 320 l8 -8 8 8 -8 8 Z M626 320 l8 -8 8 8 -8 8 Z"
      />
    </g>
  </svg>
  <div class="lifted cell"><canvas></canvas></div>
</div>
<style>
  .stage {
    position: relative;
    width: 640px;
    height: 640px;
    margin-left: -110px;
  }
  .sheet {
    position: absolute;
    inset: 44px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 24px;
    border-radius: 26px;
    background: linear-gradient(160deg, rgb(40 32 70 / 0.85), rgb(18 14 34 / 0.92));
    box-shadow:
      0 0 0 4px var(--gold),
      0 0 0 12px rgb(23 19 42 / 0.6),
      0 0 0 14px rgb(230 192 114 / 0.7),
      0 0 60px 10px rgb(230 192 114 / 0.3),
      var(--shadow);
  }
  .cell {
    position: relative;
    width: 240px;
    height: 240px;
    border-radius: 10px;
    background:
      repeating-conic-gradient(rgb(255 255 255 / 0.09) 0 25%, rgb(255 255 255 / 0.02) 0 50%) 0 0 /
        30px 30px,
      radial-gradient(
        circle at 50% 58%,
        rgb(128 100 178 / 0.75),
        rgb(52 38 92 / 0.85) 50%,
        rgb(23 19 42 / 0.9) 85%
      );
  }
  .cell canvas {
    position: absolute;
    inset: 0;
  }
  .empty {
    background: rgb(23 19 42 / 0.6);
    outline: 2px dashed rgb(230 192 114 / 0.6);
    outline-offset: -2px;
  }
  .cuts {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    stroke-width: 2;
    stroke-dasharray: 10 8;
  }
  .cuts .marks {
    fill: var(--gold);
    stroke: none;
  }
  .lifted {
    position: absolute;
    left: 440px;
    top: 356px;
    transform: rotate(7deg) scale(1.12);
    background:
      repeating-conic-gradient(rgb(255 255 255 / 0.09) 0 25%, rgb(255 255 255 / 0.02) 0 50%) 0 0 /
        30px 30px,
      radial-gradient(circle at 50% 58%, rgb(128 100 178), rgb(52 38 92) 50%, rgb(23 19 42) 85%);
    outline: 3px solid var(--gold);
    outline-offset: 9px;
    box-shadow:
      0 0 0 4px var(--gold),
      0 0 0 9px rgb(23 19 42 / 0.85),
      0 0 70px 14px rgb(230 192 114 / 0.45),
      0 40px 70px rgb(10 6 24 / 0.7);
  }
</style>
<script type="module">
  import { canvas, drawSprite } from "asset:art/pixels.js";

  const palette = {
    o: "#1b4a34",
    d: "#3a9b62",
    b: "#56c47f",
    l: "#93e6ab",
    w: "#f2fff6",
    e: "#12301f",
    s: "rgb(16 8 34 / 0.55)",
  };
  // A slime's hop, one frame per cell: rest, squash, stretch, airborne.
  const rest = [
    ".....oooooo.....",
    "...oowwbbbbbo...",
    "..olwbbbbbbbbo..",
    ".olbbebbbbebbbo.",
    ".obbbebbbbebbbo.",
    ".obbbbbddbbbbbo.",
    ".obbbbbbbbbbbdo.",
    ".oddbbbbbbbbddo.",
    "..oooooooooooo..",
  ];
  const blank = "................";
  const frames = [
    [...Array(6).fill(blank), ...rest, "...ssssssssss..."],
    [
      ...Array(8).fill(blank),
      "....oooooooo....",
      "..oowwbbbbbboo..",
      ".olwbbbbbbbbbbo.",
      "olbbbebbbbebbbbo",
      "obbbbbbddbbbbbdo",
      "oddbbbbbbbbbbddo",
      ".oooooooooooooo.",
      "..ssssssssssss..",
    ],
    [
      ...Array(2).fill(blank),
      "......oooo......",
      ".....owwbbo.....",
      "....owlbbbbo....",
      "...olbbbbbbbo...",
      "...olbbbbbbbo...",
      "...obebbbbebo...",
      "...obebbbbebo...",
      "...obbbddbbbo...",
      "...obbbbbbbdo...",
      "...oddbbbbddo...",
      "....oddddddo....",
      ".....oooooo.....",
      blank,
      "....ssssssss....",
    ],
    [...Array(2).fill(blank), ...rest, ...Array(4).fill(blank), "......ssss......"],
  ];
  function draw() {
    document.querySelectorAll(".cell canvas").forEach((element, index) => {
      const ctx = canvas(element, 240, 240);
      ctx.clearRect(0, 0, 240, 240);
      drawSprite(ctx, frames[index], palette, 0, 0, 15);
    });
  }
  if (window.automedia) window.automedia.registerRenderer(async () => draw());
  else draw();
</script>
