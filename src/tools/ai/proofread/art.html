<div class="stage" data-glow="0.5 0.45">
  <div class="sheet">
    <p>
      <span class="fix"><s>Their</s><ins>They’re</ins></span> going to
    </p>
    <p>
      the
      <span class="fix"
        >lib<span class="caret"><ins>r</ins></span
        >ary.</span
      >
    </p>
  </div>
  <svg class="quill glow" viewBox="0 0 420 420"></svg>
</div>
<style>
  .stage {
    position: relative;
    left: -40px;
  }
  .sheet {
    width: 860px;
    height: 520px;
    padding: 128px 0 0;
    text-align: center;
    border-radius: 26px;
    background:
      radial-gradient(80% 60% at 40% 40%, #fffaf0, transparent 70%),
      linear-gradient(170deg, #fbf3e6, #e6d6be);
    color: var(--ink);
    font-family: var(--serif);
    font-weight: 600;
    outline: 4px solid var(--gold);
    outline-offset: 12px;
    box-shadow:
      0 0 0 4px var(--gold),
      0 0 0 12px rgb(23 19 42 / 0.6),
      0 0 60px 10px rgb(230 192 114 / 0.35),
      0 40px 80px rgb(10 6 24 / 0.6);
  }
  p {
    margin: 0;
    font-size: 108px;
    line-height: 1;
    white-space: nowrap;
  }
  p + p {
    margin-top: 96px;
  }
  .fix {
    position: relative;
    display: inline-block;
  }
  s {
    text-decoration: none;
    position: relative;
    color: rgb(23 19 42 / 0.45);
  }
  s::after {
    content: "";
    position: absolute;
    left: -8px;
    right: -8px;
    top: 54%;
    height: 7px;
    border-radius: 4px;
    background: var(--gold-deep);
    transform: rotate(-4deg);
    box-shadow: 0 0 14px rgb(230 192 114 / 0.9);
  }
  ins {
    position: absolute;
    bottom: 92%;
    left: 50%;
    transform: translateX(-50%);
    text-decoration: none;
    white-space: nowrap;
    font-size: 84px;
    color: var(--gold-deep);
    text-shadow: 0 0 18px rgb(230 192 114 / 0.8);
  }
  .caret {
    position: relative;
    display: inline-block;
    width: 0;
    height: 1em;
  }
  .caret::before {
    content: "";
    position: absolute;
    left: -26px;
    bottom: -4px;
    width: 52px;
    height: 52px;
    border-left: 7px solid var(--gold-deep);
    border-top: 7px solid var(--gold-deep);
    border-radius: 3px;
    transform: translateY(50%) rotate(45deg);
    filter: drop-shadow(0 0 8px rgb(230 192 114 / 0.9));
  }
  .caret ins {
    bottom: 84%;
    font-size: 96px;
  }
  .quill {
    position: absolute;
    right: -150px;
    bottom: -40px;
    width: 420px;
    height: 420px;
    overflow: visible;
  }
  .quill path {
    stroke: var(--gold);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
<script type="module">
  // A gold quill: vane built around a curved shaft, with barbs and a split nib.
  const nib = [40, 400];
  const tip = [400, 24];
  const bend = [150, 130];
  const at = (t) => [
    (1 - t) ** 2 * nib[0] + 2 * (1 - t) * t * bend[0] + t * t * tip[0],
    (1 - t) ** 2 * nib[1] + 2 * (1 - t) * t * bend[1] + t * t * tip[1],
  ];
  const normal = (t) => {
    const [x0, y0] = at(Math.max(0, t - 0.01));
    const [x1, y1] = at(Math.min(1, t + 0.01));
    const len = Math.hypot(x1 - x0, y1 - y0);
    return [-(y1 - y0) / len, (x1 - x0) / len];
  };
  const width = (t, side) => {
    const u = Math.min(1, Math.max(0, (t - 0.26) / 0.74));
    return Math.max(0, Math.sin(Math.PI * u ** 0.75)) ** 0.5 * side;
  };
  const edge = (side) => {
    const points = [];
    for (let t = 0.26; t <= 1.0001; t += 0.015) {
      const [x, y] = at(t);
      const [nx, ny] = normal(t);
      const w = width(t, side);
      points.push(`${(x + nx * w).toFixed(1)} ${(y + ny * w).toFixed(1)}`);
    }
    return points;
  };
  const left = edge(50);
  const right = edge(-26).reverse();
  let svg = `<path d="M ${left.join(" L ")} L ${right.join(" L ")} Z" fill="rgb(23 19 42 / 0.9)" stroke-width="3" />`;
  for (let t = 0.34; t < 0.9; t += 0.06) {
    for (const side of [50, -26]) {
      const [x, y] = at(t);
      const [nx, ny] = normal(t + 0.06);
      const [tx, ty] = at(t + 0.06);
      const w = width(t + 0.06, side) * 0.8;
      svg += `<path d="M ${x} ${y} Q ${x + nx * w * 0.5} ${y + ny * w * 0.5} ${tx + nx * w} ${ty + ny * w}" fill="none" stroke-width="2.5" opacity="0.8" />`;
    }
  }
  const curve = [];
  for (let t = 0; t <= 1.0001; t += 0.02)
    curve.push(
      at(t)
        .map((v) => v.toFixed(1))
        .join(" "),
    );
  svg += `<path d="M ${curve.join(" L ")}" fill="none" stroke-width="6" />`;
  const [bx, by] = at(0.14);
  svg += `<path d="M ${nib[0]} ${nib[1]} L ${bx - 9} ${by - 4} Q ${bx} ${by - 14} ${bx + 7} ${by + 6} Z" fill="#e6c072" />`;
  document.querySelector(".quill").innerHTML = svg;
  window.automedia?.registerRenderer(() => document.fonts.ready.catch(() => {}));
</script>
