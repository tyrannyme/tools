<div class="stage" data-glow="0.5 0.42">
  <div class="frame">
    <div class="sound">
      <svg class="wave glow" viewBox="0 0 928 240"></svg>
    </div>
    <div class="seam"></div>
    <div class="words">
      <p style="left: 4.8%; width: 53.3%"><small>0:00</small>Spoken by<br />a computer,</p>
      <p style="left: 65.1%; width: 29%"><small>0:05</small>nothing is<br />uploaded.</p>
    </div>
  </div>
</div>
<style>
  .stage {
    position: relative;
    filter: drop-shadow(0 40px 60px rgb(10 6 24 / 0.6));
  }
  .frame {
    position: relative;
    width: 1000px;
    height: 556px;
    border-radius: 30px;
    overflow: hidden;
    outline: 4px solid var(--gold);
    outline-offset: 12px;
    box-shadow:
      0 0 0 4px var(--gold),
      0 0 0 12px rgb(23 19 42 / 0.6),
      0 0 60px 10px rgb(230 192 114 / 0.35);
  }
  .sound {
    position: absolute;
    inset: 0 0 53% 0;
    background:
      radial-gradient(70% 90% at 50% 60%, rgb(70 54 110 / 0.5), transparent 70%),
      linear-gradient(180deg, #1d1736, #120f22);
  }
  .wave {
    position: absolute;
    left: 36px;
    top: 10px;
    width: 928px;
    height: 240px;
  }
  .wave rect {
    fill: url(#bar);
  }
  .seam {
    z-index: 1;
    position: absolute;
    left: 0;
    right: 0;
    top: calc(47% - 2px);
    height: 4px;
    background: var(--gold-light);
    box-shadow: 0 0 24px 6px rgb(230 192 114 / 0.8);
  }
  .words {
    position: absolute;
    inset: 47% 0 0 0;
    background:
      radial-gradient(ellipse 70% 70% at 50% 40%, rgb(230 192 114 / 0.14), transparent 70%),
      linear-gradient(170deg, #2c2350, #17132a 85%);
    color: var(--mist);
  }
  .words p {
    z-index: 2;
    position: absolute;
    top: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 76px;
    line-height: 0.98;
    white-space: nowrap;
    filter: drop-shadow(0 0 14px rgb(230 192 114 / 0.35));
  }
  .words small {
    position: relative;
    margin: 40px 0 20px;
    padding: 4px 14px;
    border-radius: 99px;
    box-shadow: inset 0 0 0 2px var(--gold);
    color: var(--gold);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0.04em;
  }
  .words small::before {
    content: "";
    position: absolute;
    left: calc(50% - 1px);
    bottom: 100%;
    width: 2px;
    height: 40px;
    background: var(--gold);
  }
  .words small::after {
    content: "";
    position: absolute;
    left: calc(50% - 9px);
    top: -49px;
    width: 18px;
    height: 18px;
    transform: rotate(45deg);
    background: var(--ink);
    box-shadow:
      inset 0 0 0 3px var(--gold),
      0 0 14px rgb(230 192 114 / 0.8);
  }
</style>
<script type="module">
  // RMS of public/samples/tyranny-speech.m4a, 0.2 s to 8.85 s in 80 steps.
  const levels = [
    0, 76, 52, 61, 73, 8, 56, 7, 50, 37, 55, 41, 50, 51, 38, 38, 17, 47, 48, 18, 7, 1, 0, 0, 87,
    100, 78, 79, 39, 0, 48, 75, 66, 62, 32, 61, 38, 43, 61, 34, 45, 57, 62, 34, 14, 32, 2, 0, 0, 0,
    0, 0, 0, 55, 85, 39, 72, 58, 65, 46, 30, 30, 24, 10, 0, 0, 82, 85, 81, 55, 23, 59, 28, 44, 57,
    59, 20, 8, 1, 0,
  ];
  // Whisper's two segments (00:00 and 00:05) as ranges of those steps.
  const segments = [
    [1, 46],
    [53, 77],
  ];
  const step = 928 / levels.length;
  let svg = `<defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e6c072" /><stop offset="0.5" stop-color="#fff4d6" />
    <stop offset="1" stop-color="#e6c072" /></linearGradient></defs>`;
  for (const [i, level] of levels.entries()) {
    const h = Math.max(6, (level / 100) * 190);
    svg += `<rect x="${i * step + 2.2}" y="${112 - h / 2}" width="${step - 4.4}" height="${h}" rx="${(step - 4.4) / 2}" />`;
  }
  for (const [from, to] of segments) {
    const a = from * step + 2;
    const b = (to + 1) * step - 2;
    svg += `<path d="M ${a} 218 V 230 H ${b} V 218" fill="none" stroke="#e6c072" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;
  }
  document.querySelector(".wave").innerHTML = svg;
  window.automedia?.registerRenderer(() => document.fonts.ready.catch(() => {}));
</script>
